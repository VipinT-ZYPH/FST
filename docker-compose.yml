services:
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nextjs-standalone:latest
    container_name: nextjs_production_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      # Secrets come from your shell or a local .env file (never baked into the image)
      JWT_SECRET: ${JWT_SECRET:-}
    healthcheck:
      # busybox wget ships with node:20-alpine; 127.0.0.1 avoids IPv6 localhost issues
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
